<!-- Index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Scribe</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 40px 20px;
            color: #222;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 20px;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }

        button:disabled {
            background-color: #ccc !important;
            cursor: not-allowed;
        }

        #startBtn {
            background-color: #4CAF50;
        }

        #pauseBtn {
            background-color: #ff9800;
        }

        #resumeBtn {
            background-color: #2196F3;
        }

        #stopBtn {
            background-color: #f44336;
        }

        #processBtn {
            background-color: #6c4bc4;
        }

        #copyBtn {
            background-color: #555;
            margin-top: 12px;
        }

        .status {
            text-align: center;
            margin: 20px 0;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
        }

        .status.ready {
            background-color: #e8f5e8;
            color: #2e7d32;
        }

        .status.recording {
            background-color: #fff3cd;
            color: #856404;
        }

        .status.paused {
            background-color: #e3f2fd;
            color: #0d47a1;
        }

        .status.processing {
            background-color: #f3e5f5;
            color: #4a148c;
        }

        .status.error {
            background-color: #ffebee;
            color: #c62828;
        }

        .result-section {
            background-color: white;
            margin-top: 20px;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        .result-section h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .clinical-report {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            white-space: pre-wrap;
            min-height: 100px;
        }

        .copy-container {
            display: flex;
            justify-content: flex-end;
        }

        #copyMessage {
            display: none;
            margin-top: 10px;
            color: #2e7d32;
            font-size: 14px;
        }

        details {
            margin-top: 20px;
        }

        summary {
            cursor: pointer;
            color: #555;
            font-weight: bold;
        }

        #audioResult {
            margin-top: 15px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 6px;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Scribe</h1>

    <p class="subtitle">
        Record a patient conversation and generate an HPI summary.
    </p>

    <!-- Recording controls -->
    <div class="controls">
        <button id="startBtn">Start Recording</button>
        <button id="pauseBtn" disabled>Pause</button>
        <button id="resumeBtn" disabled>Resume</button>
        <button id="stopBtn" disabled>Stop Recording</button>
        <button id="processBtn" disabled>Generate HPI</button>
    </div>

    <!-- Status -->
    <div id="status" class="status ready">
        Ready to record patient conversation
    </div>

    <!-- HPI result -->
    <div class="result-section">
        <h2>HPI Summary</h2>

        <div id="result" class="clinical-report">
            Your HPI summary will appear here after processing.
        </div>

        <div class="copy-container">
            <button id="copyBtn" disabled>Copy HPI</button>
        </div>

        <div id="copyMessage">
            HPI copied to clipboard!
        </div>
    </div>

    <!-- Optional transcript -->
    <div class="result-section">
        <details>
            <summary>View Audio Transcript</summary>

            <div id="audioResult">
                The transcript will appear here after processing.
            </div>
        </details>
    </div>

</div>


<script>

let mediaRecorder;
let audioChunks = [];
let isRecording = false;
let recordedAudioBlob = null;

const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const resumeBtn = document.getElementById("resumeBtn");
const stopBtn = document.getElementById("stopBtn");
const processBtn = document.getElementById("processBtn");
const copyBtn = document.getElementById("copyBtn");

const statusMsg = document.getElementById("status");
const result = document.getElementById("result");
const audioResult = document.getElementById("audioResult");
const copyMessage = document.getElementById("copyMessage");


function setStatus(message, statusClass) {
    statusMsg.textContent = message;
    statusMsg.className = `status ${statusClass}`;
}


// ============================
// START RECORDING
// ============================

startBtn.onclick = async () => {

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        mediaRecorder = new MediaRecorder(stream, {
            mimeType: "audio/webm"
        });

        audioChunks = [];
        recordedAudioBlob = null;

        result.textContent =
            "Your HPI summary will appear here after processing.";

        audioResult.textContent =
            "The transcript will appear here after processing.";

        copyBtn.disabled = true;

        mediaRecorder.ondataavailable = event => {

            if (event.data.size > 0) {
                audioChunks.push(event.data);
            }

        };

        mediaRecorder.onstop = () => {

            recordedAudioBlob = new Blob(
                audioChunks,
                { type: "audio/webm" }
            );

        };

        mediaRecorder.start();

        isRecording = true;

        setStatus(
            "Recording patient conversation...",
            "recording"
        );

        startBtn.disabled = true;
        pauseBtn.disabled = false;
        resumeBtn.disabled = true;
        stopBtn.disabled = false;
        processBtn.disabled = true;

    }

    catch (err) {

        console.error("Microphone error:", err);

        alert(
            "Microphone access error: " + err.message
        );

        setStatus(
            "Microphone access error",
            "error"
        );

    }

};


// ============================
// PAUSE
// ============================

pauseBtn.onclick = () => {

    if (
        mediaRecorder &&
        mediaRecorder.state === "recording"
    ) {

        mediaRecorder.pause();

        pauseBtn.disabled = true;
        resumeBtn.disabled = false;

        setStatus(
            "Recording paused",
            "paused"
        );

    }

};


// ============================
// RESUME
// ============================

resumeBtn.onclick = () => {

    if (
        mediaRecorder &&
        mediaRecorder.state === "paused"
    ) {

        mediaRecorder.resume();

        pauseBtn.disabled = false;
        resumeBtn.disabled = true;

        setStatus(
            "Recording resumed",
            "recording"
        );

    }

};


// ============================
// STOP
// ============================

stopBtn.onclick = () => {

    if (
        mediaRecorder &&
        isRecording
    ) {

        mediaRecorder.stop();

        mediaRecorder.stream
            .getTracks()
            .forEach(track => track.stop());

        isRecording = false;

        setStatus(
            "Recording stopped - Ready to generate HPI",
            "ready"
        );

        startBtn.disabled = false;
        pauseBtn.disabled = true;
        resumeBtn.disabled = true;
        stopBtn.disabled = true;
        processBtn.disabled = false;

    }

};


// ============================
// PROCESS AUDIO
// ============================

processBtn.onclick = async () => {

    if (!recordedAudioBlob) {

        alert(
            "No recording available to process."
        );

        return;

    }

    setStatus(
        "Processing audio and generating HPI...",
        "processing"
    );

    processBtn.disabled = true;
    copyBtn.disabled = true;

    result.textContent =
        "Generating HPI summary...";


    const formData = new FormData();

    formData.append(
        "audio",
        recordedAudioBlob,
        "recording.webm"
    );


    try {

        const response = await fetch(
            "/process_audio",
            {
                method: "POST",
                body: formData
            }
        );


        /*
         * Check the response before trying response.json().
         * This prevents the old "Unexpected end of JSON input"
         * error from hiding the actual server error.
         */

        const responseText = await response.text();

        let data;

        try {

            data = JSON.parse(responseText);

        }

        catch {

            throw new Error(
                `Server returned an invalid response (HTTP ${response.status}).`
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error || "Unable to process recording."
            );

        }


        // Display HPI
        result.textContent =
            data.hpi || data.summary || "No HPI summary received.";

        console.log("Server response:", data);

        // Transcript remains available but hidden
        audioResult.textContent =
            data.transcript || "No transcript received.";


        // Enable copy button
        copyBtn.disabled = false;


        setStatus(
            "HPI generated successfully",
            "ready"
        );


        // Reset recording
        recordedAudioBlob = null;
        audioChunks = [];

    }

    catch (err) {

        console.error(
            "Error processing:",
            err
        );

        result.textContent =
            "Unable to generate the HPI.";

        setStatus(
            "Error during processing",
            "error"
        );

    }

    finally {

        processBtn.disabled = false;

    }

};


// ============================
// COPY HPI
// ============================

copyBtn.onclick = async () => {

    const hpiText = result.textContent.trim();

    if (!hpiText) {
        return;
    }

    try {

        await navigator.clipboard.writeText(
            hpiText
        );

        copyMessage.style.display = "block";

        setTimeout(() => {

            copyMessage.style.display = "none";

        }, 2000);

    }

    catch (err) {

        console.error(
            "Could not copy HPI:",
            err
        );

        alert(
            "Unable to copy the HPI. Please select and copy the text manually."
        );

    }

};

</script>

</body>
</html>
